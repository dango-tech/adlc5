name = "adlc5-telemetry-intake"
main = "src/index.mjs"
compatibility_date = "2026-10-18"
workers_dev = false

[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "adlc5-telemetry"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 3
period = 60

[triggers]
crons = ["0 4 * * *"]
