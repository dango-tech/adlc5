site_name: ADLC5
site_description: "Learn, install, and use ADLC5: a repeatable AI coding delivery workflow grounded in repository intelligence and current evidence."
site_url: !ENV [DOCS_SITE_URL, 'https://adlc5.dev/']
repo_url: https://github.com/dango-tech/adlc5
docs_dir: website/docs
site_dir: site
exclude_docs: |
  assets/brand/README.md
  assets/brand/banner.txt
theme:
  name: material
  custom_dir: website/overrides
  font: false
  logo: assets/brand/icon.svg
  favicon: assets/brand/icon.svg
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: black
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.footer
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Walkthrough: walkthrough.md
  - Lifecycle: lifecycle.md
  - Running agents: running.md
  - Intelligence: intelligence.md
  - Troubleshooting: support.md
  - Releases: releases.md
  - Reference: reference.md
