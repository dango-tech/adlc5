# ADLC5 invokable skill registry — every skills/*/SKILL.md is listed
schema_version: "3.0"
framework_version: "5.2.0"

personas_registry: "core/personas.yaml"

core:
  - id: adlc5
    invoke: "@adlc5"
    path: skills/adlc5/SKILL.md
    role: Navigator, stage router, autopilot loop
    model_tier: balanced

  - id: adlc5-specify
    invoke: "@adlc5-specify"
    path: skills/specify/SKILL.md
    stage: specify
    model_tier: balanced

  - id: adlc5-plan
    invoke: "@adlc5-plan"
    path: skills/plan/SKILL.md
    stage: plan
    model_tier: reasoning

  - id: adlc5-tasks
    invoke: "@adlc5-tasks"
    path: skills/tasks/SKILL.md
    stage: tasks
    model_tier: balanced

  - id: adlc5-implement
    invoke: "@adlc5-implement"
    path: skills/implement/SKILL.md
    stage: implement
    model_tier: implementation

auxiliary:
  - id: adlc5-pulse
    invoke: "@adlc5-pulse"
    path: skills/pulse/SKILL.md
    stage: implement
    description: On-demand local delivery snapshot, offline board, and handoff

  - id: discover
    invoke: "@discover"
    path: skills/discover/SKILL.md
    stage: specify

  - id: prt
    invoke: "@prt"
    path: skills/prt/SKILL.md
    stage: specify

  - id: autoresearch
    invoke: "@autoresearch"
    path: skills/autoresearch/SKILL.md
    stage: plan

  - id: build-implementer
    invoke: "@build-implementer"
    path: skills/build-implementer/SKILL.md
    subagent: true

  - id: assure-verifier
    invoke: "@assure-verifier"
    path: skills/assure-verifier/SKILL.md
    subagent: true

  - id: adlc5-assure-reworker
    invoke: "@adlc5-assure-reworker"
    path: skills/adlc5-assure-reworker/SKILL.md
    subagent: true

  - id: qa
    invoke: "@qa"
    path: skills/qa/SKILL.md
    stage: implement

  - id: pr-reviewer
    invoke: "@pr-reviewer"
    path: skills/pr-reviewer/SKILL.md
    stage: implement

  - id: project-wiki
    invoke: "@adlc5-project-wiki"
    path: skills/project-wiki/SKILL.md

setup:
  - id: adlc5-setup
    invoke: "@adlc5-setup"
    path: skills/adlc5-setup/SKILL.md
    role: Plugin-host consumer setup — preflight, missing scaffolding, duplicate detection (repeat-safe)
    model_tier: execution

soul:
  - id: adlc5-soul
    invoke: "@adlc5-soul"
    path: skills/adlc5-soul/SKILL.md
    role: Supporting reasoning discipline — graph/evidence-aware five guards, cross-cutting (all stages)
    rule: shared/rules/portable/adlc5-soul.md
    model_tier: reasoning

craftsmanship:
  - id: clean-architecture-review
    invoke: "@clean-architecture-review"
    path: skills/clean-architecture-review/SKILL.md
    stage: plan

  - id: design-pattern-advisor
    invoke: "@design-pattern-advisor"
    path: skills/design-pattern-advisor/SKILL.md
    stage: plan

  - id: algorithm-advisor
    invoke: "@algorithm-advisor"
    path: skills/algorithm-advisor/SKILL.md
    stage: plan

  - id: craftsmanship-code-review
    invoke: "@craftsmanship-code-review"
    path: skills/craftsmanship-code-review/SKILL.md
    stage: implement

  - id: complexity-review
    invoke: "@complexity-review"
    path: skills/complexity-review/SKILL.md
    stage: implement

  - id: adlc5-tdd
    invoke: "@adlc5-tdd"
    path: skills/adlc5-tdd/SKILL.md
    stage: implement
    role: FIRST tests, red-green-refactor discipline for build workers

design:
  - id: adlc5-design-critic
    invoke: "@adlc5-design-critic"
    path: skills/adlc5-design-critic/SKILL.md
    stage: plan
    subagent: true
    role: Read-only design coherence check (plan-7-design-critique)

delivery:
  - id: infra
    invoke: "@infra"
    path: skills/infra/SKILL.md
    stage: plan
    role: IaC authoring and validation (never applies)

  - id: deploy
    invoke: "@deploy"
    path: skills/deploy/SKILL.md
    stage: post-pr
    role: Clearance-gated deployment orchestration, always HITL for production

  - id: autoresearch-experimenter
    invoke: "@autoresearch-experimenter"
    path: skills/autoresearch-experimenter/SKILL.md
    subagent: true
    role: Runs one autoresearch trial

pbe:
  - id: pbe-pattern-opportunity
    invoke: "@pbe-pattern-opportunity"
    path: skills/pbe-pattern-opportunity/SKILL.md
    stage: plan

  - id: pbe-select-patterns
    invoke: "@pbe-select-patterns"
    path: skills/pbe-select-patterns/SKILL.md
    stage: plan

  - id: pbe-review-with-patterns
    invoke: "@pbe-review-with-patterns"
    path: skills/pbe-review-with-patterns/SKILL.md
    stage: implement

  - id: pbe-determine-business-impact
    invoke: "@pbe-determine-business-impact"
    path: skills/pbe-determine-business-impact/SKILL.md
    role: Catalog ROI gate

  - id: pbe-exemplar-analysis
    invoke: "@pbe-exemplar-analysis"
    path: skills/pbe-exemplar-analysis/SKILL.md
    role: Catalog — derive pattern structure from reference code

  - id: pbe-pattern-description
    invoke: "@pbe-pattern-description"
    path: skills/pbe-pattern-description/SKILL.md
    role: Catalog — write org pattern specification

  - id: pbe-piecemeal-skill
    invoke: "@pbe-piecemeal-skill"
    path: skills/pbe-piecemeal-skill/SKILL.md
    role: Catalog — MVP pattern implementation as skill/rule/hook
