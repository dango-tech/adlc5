name: Release host plugin packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      attach_draft:
        description: Attach packages to the draft release named by release_tag
        type: boolean
        default: false
      publish_registry:
        description: Also publish an existing release to GitHub Packages
        type: boolean
        default: false
      release_tag:
        description: Draft release tag to attach to, or published release tag to publish to GitHub Packages
        type: string
        default: v5.3.1

permissions:
  contents: write

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Archive and installer compatibility (four hosts)
        run: python scripts/tests/test-plugin-install.py

  packages:
    needs: compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build host packages
        run: python3 scripts/package-plugin.py --out /tmp/adlc5-release-packages
      - name: Verify archive and installer contracts
        run: python3 scripts/tests/test-plugin-install.py
      - name: Upload downloadable packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adlc5-agent-packages-${{ github.sha }}
          path: |
            /tmp/adlc5-release-packages/*.zip
            /tmp/adlc5-release-packages/*.tar.gz
            /tmp/adlc5-release-packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      # Immutable releases refuse new assets once published, so packages go onto the draft first.
      - name: Attach all four host packages and checksums to the draft release
        if: inputs.attach_draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version="$(tr -d '[:space:]' < core/VERSION)"
          [[ "$RELEASE_TAG" == "$version" || "$RELEASE_TAG" == "v$version" ]] || { echo 'Release tag must match core/VERSION'; exit 1; }
          [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == true ]] || { echo 'Release must still be a draft'; exit 1; }
          # Compare with the checkout, not GITHUB_SHA: a branch checkout can move past the triggering commit.
          built="$(git rev-parse HEAD)"
          target="$(gh release view "$RELEASE_TAG" --json targetCommitish --jq .targetCommitish)"
          [[ "$target" == "$built" ]] || { echo "Draft targets $target but this run built $built"; exit 1; }
          gh release upload "$RELEASE_TAG" \
            "/tmp/adlc5-release-packages/adlc5-codex-plugin-${version}.zip" \
            "/tmp/adlc5-release-packages/adlc5-codex-plugin-${version}.tar.gz" \
            "/tmp/adlc5-release-packages/adlc5-claude-code-plugin-${version}.zip" \
            "/tmp/adlc5-release-packages/adlc5-claude-code-plugin-${version}.tar.gz" \
            "/tmp/adlc5-release-packages/adlc5-cursor-plugin-${version}.zip" \
            "/tmp/adlc5-release-packages/adlc5-cursor-plugin-${version}.tar.gz" \
            "/tmp/adlc5-release-packages/adlc5-hermes-plugin-${version}.zip" \
            "/tmp/adlc5-release-packages/adlc5-hermes-plugin-${version}.tar.gz" \
            "/tmp/adlc5-release-packages/SHA256SUMS"

  registry:
    needs: packages
    if: github.event_name == 'release' || inputs.publish_registry
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
      REPOSITORY: ${{ github.repository }}
      REGISTRY_USER: ${{ github.actor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.0
      - name: Download and verify published release archives
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a version release tag'; exit 1; }
          mkdir -p "$RUNNER_TEMP/plugin-release"
          cd "$RUNNER_TEMP/plugin-release"
          gh release download "$RELEASE_TAG" --repo "$REPOSITORY" --pattern 'adlc5-*-plugin-*.zip' --pattern 'adlc5-*-plugin-*.tar.gz' --pattern SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          python "$GITHUB_WORKSPACE/scripts/verify-plugin-release.py" . --version "${RELEASE_TAG#v}"
      - name: Publish and verify each host package
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$REGISTRY_USER" --password-stdin
          trap 'oras logout ghcr.io' EXIT
          cd "$RUNNER_TEMP/plugin-release"
          version="${RELEASE_TAG#v}"
          owner="${REPOSITORY%%/*}"
          owner="${owner,,}"
          for host in codex claude-code cursor hermes; do
            name="adlc5-${host}-plugin"
            zip="${name}-${version}.zip"
            tar="${name}-${version}.tar.gz"
            mkdir "$host"
            cp "$zip" "$tar" "$host/"
            sha256sum "$zip" "$tar" > "$host/SHA256SUMS"
            ref="ghcr.io/${owner}/${name}:${version}"
            (
              cd "$host"
              oras push --image-spec v1.0 --artifact-type application/vnd.adlc5.plugin.v1 \
                --annotation "org.opencontainers.image.source=https://github.com/${REPOSITORY}" \
                --annotation "org.opencontainers.image.version=${version}" \
                --annotation "org.opencontainers.image.description=ADLC5 ${host} plugin archives. Extract and run install.py; this is not a runnable container. See the linked GitHub release for preview status and OS prerequisites." \
                "$ref" "$zip:application/zip" "$tar:application/gzip" SHA256SUMS:text/plain
              oras pull "$ref" --output verify
              (cd verify && sha256sum --check --strict SHA256SUMS)
              cmp "$zip" "verify/$zip"
              cmp "$tar" "verify/$tar"
            )
            echo "- Published and pulled back verified package: \`$ref\`" >> "$GITHUB_STEP_SUMMARY"
          done
