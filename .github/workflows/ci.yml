name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.plan.outputs.full }}
      pulse: ${{ steps.plan.outputs.pulse }}
      runner: ${{ steps.plan.outputs.runner }}
      platforms: ${{ steps.plan.outputs.platforms }}
      packages: ${{ steps.plan.outputs.packages }}
      install: ${{ steps.plan.outputs.install }}
      docs: ${{ steps.plan.outputs.docs }}
      telemetry: ${{ steps.plan.outputs.telemetry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 scripts/tests/test-ci-plan.py
          if [[ "$EVENT" == pull_request ]]; then
            python3 scripts/ci-plan.py --base "$BASE" --head "$HEAD" --output "$GITHUB_OUTPUT" > ci-plan.json
          else
            python3 scripts/ci-plan.py --base "$BASE" --head "$HEAD" --full --output "$GITHUB_OUTPUT" > ci-plan.json
          fi
          cat ci-plan.json >> "$GITHUB_STEP_SUMMARY"

  privacy:
    name: privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Privacy regressions and checked-out history
        run: |
          python3 scripts/check-publication.py --self-test
          python3 scripts/check-publication.py

  test:
    needs: [changes, pulse, runner, packages, telemetry, docs]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Evaluation keeps a frozen pre-change framework revision.

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install jq
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.platforms == 'true'
        run: |
          if ! command -v jq >/dev/null; then
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              brew install jq
            else
              sudo apt-get update
              sudo apt-get install -y jq
            fi
          fi

      - name: Verify selected dependencies
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci-plan.py --verify-dependencies

      - name: Contract tests (system Bash)
        if: needs.changes.outputs.full == 'true'
        run: /bin/bash ./scripts/tests/run-all.sh

      - name: Focused Pulse and path compatibility
        if: needs.changes.outputs.full != 'true' && needs.changes.outputs.platforms == 'true'
        run: |
          python3 scripts/tests/test-pulse.py
          python3 scripts/tests/test-pulse-fleet.py
          python3 scripts/tests/test-windows-regressions.py

      - name: Disposable install and verification
        if: needs.changes.outputs.install == 'true'
        run: python3 scripts/tests/test-portable-install.py

      - name: Distribution exclusions and publication inputs
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.platforms == 'true'
        run: python3 scripts/tests/test-distribution.py

  # Focused regressions for issue #20. The broader suites still assume symlinks
  # and /bin/bash on Windows; see the follow-up PR before widening this job.
  windows:
    needs: changes
    name: test (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash  # Git for Windows Bash, as contributors use it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Tooling on PATH
        if: needs.changes.outputs.platforms == 'true'
        run: |
          # Scripts call python3; native Windows Python installs only python.exe.
          if ! command -v python3 >/dev/null; then
            dir="$(dirname "$(command -v python)")"
            cp "$dir/python.exe" "$dir/python3.exe"
          fi
          command -v jq >/dev/null || choco install jq --no-progress -y
          for tool in bash python3 jq git; do printf '%s: %s\n' "$tool" "$(command -v "$tool")"; done
          python3 -c 'import shutil; print("python sees bash:", shutil.which("bash"))'

      - name: Windows regressions
        if: needs.changes.outputs.platforms == 'true'
        run: |
          python3 scripts/tests/test-windows-regressions.py -v
          python3 scripts/tests/test-repository-context.py -v
          python3 scripts/tests/test-cursor-usage.py -v  # owner-only credential ACL
          python3 scripts/tests/test-telemetry-share.py -v
          python3 scripts/tests/test-config-routing.py

  pulse:
    needs: changes
    if: needs.changes.outputs.pulse == 'true' && needs.changes.outputs.platforms != 'true' && needs.changes.outputs.full != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - run: |
          python3 scripts/tests/test-pulse.py
          python3 scripts/tests/test-pulse-fleet.py
          node --check shared/pulse/board.js
          node scripts/tests/test-pulse-views.mjs

  packages:
    needs: changes
    if: needs.changes.outputs.packages == 'true' && needs.changes.outputs.full != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: |
          python3 scripts/package-plugin.py --out /tmp/adlc5-ci-packages
          python3 scripts/tests/test-distribution.py
          python3 scripts/tests/test-plugin-install.py

  runner:
    needs: changes
    if: needs.changes.outputs.runner == 'true' && needs.changes.outputs.full != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - run: |
          for test in test-requirements-readiness.py test-runner-core.py test-runner-hosts.py test-workflow-reliability.py test_completion_evidence.py test_completion_cli.py test-lightweight-workflow.py test-evaluation-pilot.py; do
            python3 "scripts/tests/$test"
          done

  telemetry:
    needs: changes
    if: needs.changes.outputs.telemetry == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: node --test telemetry-intake/test/index.test.mjs

  docs:
    name: build
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: |
          python -m pip install -r requirements-docs.txt
          npm ci
          python -m mkdocs build --strict
          cp node_modules/@vercel/speed-insights/dist/index.mjs site/assets/speed-insights.mjs
          python scripts/tests/test-docs-site.py --site-dir site
        env:
          DOCS_SITE_URL: https://adlc5.dev/

  required:
    name: CI required
    if: always()
    needs: [changes, privacy, test, windows, pulse, runner, packages, telemetry, docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci-plan.py --verify
