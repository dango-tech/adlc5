name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  privacy:
    name: privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Privacy regressions and complete reachable history
        run: |
          python3 scripts/check-publication.py --self-test
          python3 scripts/check-publication.py

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Evaluation keeps a frozen pre-change framework revision.

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null; then
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              brew install jq
            else
              sudo apt-get update
              sudo apt-get install -y jq
            fi
          fi

      - name: Contract tests (system Bash)
        run: /bin/bash ./scripts/tests/run-all.sh

      - name: Disposable install and verification
        run: python3 scripts/tests/test-portable-install.py

      - name: Distribution exclusions and publication inputs
        run: python3 scripts/tests/test-distribution.py
