name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Contract tests
        run: ./scripts/tests/run-all.sh

      - name: Install (claude platform)
        run: ./scripts/install.sh --platform claude

      - name: Verify install
        run: ./scripts/verify-install.sh --platform claude
