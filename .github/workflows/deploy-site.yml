name: Deploy ADLC5 private preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adlc5-site-private-preview
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: private-preview
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: 58.4.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install and validate documentation
        env:
          DOCS_SITE_URL: https://adlc5.dev/
        run: |
          python -m pip install -r requirements-docs.txt
          python -m mkdocs build --strict
          python scripts/tests/test-docs-site.py --site-dir site
      - name: Install pinned Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"
      - name: Pull Vercel project configuration
        run: vercel pull --yes --environment=preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to Vercel
        id: deploy
        run: |
          url="$(vercel deploy --yes)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployment: $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Record deployment summary
        run: |
          {
            echo "## ADLC5 site deployment"
            echo "- Target: private-preview"
            echo "- Commit: $GITHUB_SHA"
            echo "- URL: ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
