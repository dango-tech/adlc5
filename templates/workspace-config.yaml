# Repository overrides live in the Git common directory at adlc5-shared/config.yaml.
# New choices are made with `adlc5 setup models --repo`.
git_branch_prefix: feat

model_routing:
  strategy: cost_optimized

defaults:
  interaction_mode: hitl
  execution_mode: parallel
  clarity_threshold: 80
  summary: brief

# Optional project wiki and scaffold preferences may be added by the repository owner.
