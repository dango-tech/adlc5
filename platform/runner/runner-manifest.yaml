# ADLC5 L4 runner manifest
schema_version: "3.0"

backends:
  local:
    description: "Deterministic navigator — emits needs_executor for host-owned agent actions"
    dispatch: scripts/runner/dispatch.sh
    watch: scripts/runner/watch.sh

  codex-local:
    description: "Supervised local runner; Codex workers use workspace-write confinement"
    dispatch: scripts/runner/run.py
    host: codex
    mode: confined

  claude-local:
    description: "Claude Code headless runner with repo command allowlist and host permission denials"
    dispatch: scripts/runner/run.py
    host: claude
    mode: allowlist

  cursor-local:
    description: "Cursor Agent headless runner with sandbox confinement; --force is forbidden"
    dispatch: scripts/runner/run.py
    host: cursor
    mode: confined

  hermes-local:
    description: "Hermes Agent attended runner; unattended execution is allowed only inside a declared container"
    dispatch: scripts/runner/run.py
    host: hermes
    mode: attended

  cursor-cloud:
    description: "Cursor Cloud Agents (stub — wire SDK when available)"
    dispatch: platform/runner/cursor-cloud-stub.sh
    docs: "https://cursor.com/docs/cloud-agent"

  cursor-sdk:
    description: "@cursor/sdk programmatic agents"
    dispatch: platform/runner/cursor-sdk-stub.sh
    skill: ~/.cursor/skills-cursor/sdk/SKILL.md

contract: |
  Runners MUST invoke scripts/pilot-autopilot.sh and scripts/check-gates.py —
  no duplicate gate logic in runner adapters. The local backend remains a
  navigator-only interface; local host adapters invoke supervised workers and
  route every lifecycle change through scripts/adlc5. Hermes is not confined
  by its own CLI and must never run unattended outside a container boundary.
