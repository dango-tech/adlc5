  <path d="M168 294V327" fill="none" stroke="#16785b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect class="tile" x="26" y="331" width="284" height="62" rx="10" fill="white" stroke="#bfd1c9"/>
  <rect x="37" y="344" width="36" height="36" rx="8" fill="#d9f4e4" stroke="none"/>
  <g transform="translate(43 350)" fill="none" stroke="#16785b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 6l-6 6 6 6m8-12 6 6-6 6m-3-14-2 16"/>
  </g>
  <text x="84" y="357" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="650" fill="#112825">Agent worker</text>
  <text x="84" y="378" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" font-weight="450" fill="#526964">Reason, edit and verify</text>
  <path d="M512 294V445" fill="none" stroke="#16785b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="523" y="370" font-family="Inter,Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#16785b">Record</text>
  <text x="523" y="388" font-family="Inter,Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#16785b">progress</text>
  <rect x="17" y="415" width="646" height="101" rx="12" fill="#e9f4ed" stroke="#97bba8"/>
  <text x="271" y="438" font-family="Menlo,Consolas,monospace" font-size="12" font-weight="650" fill="#16785b">CONSUMER REPOSITORY</text>
  <path d="M97 449V397" fill="none" stroke="#16785b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M244 393V449" fill="none" stroke="#16785b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="30" y="451" width="154" height="54" rx="6" fill="white" stroke="#bfd1c9"/>
  <text x="41" y="475" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="620" fill="#112825">Guidance + index</text>
  <text x="41" y="494" font-family="Inter,Arial,Helvetica,sans-serif" font-size="13" font-weight="450" fill="#526964">Focused context</text>
  <rect x="196" y="451" width="153" height="54" rx="6" fill="white" stroke="#bfd1c9"/>
  <text x="207" y="475" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="620" fill="#112825">Source + tests</text>
  <text x="207" y="494" font-family="Inter,Arial,Helvetica,sans-serif" font-size="13" font-weight="450" fill="#526964">Code and checks</text>
  <rect x="362" y="451" width="285" height="54" rx="6" fill="white" stroke="#bfd1c9"/>
  <text x="373" y="475" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="620" fill="#112825">Feature state + evidence</text>
  <text x="373" y="494" font-family="Inter,Arial,Helvetica,sans-serif" font-size="13" font-weight="450" fill="#526964">Intent, decisions and usage</text>
  <path d="M512 411V447" fill="none" stroke="#16785b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M512 516V533" fill="none" stroke="#16785b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect class="tile" x="370" y="537" width="284" height="62" rx="10" fill="white" stroke="#bfd1c9"/>
  <rect x="381" y="550" width="36" height="36" rx="8" fill="#d9f4e4" stroke="none"/>
  <g transform="translate(387 556)" fill="none" stroke="#16785b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1 13h5l3-8 5 15 3-9 2 2h4"/>
  </g>
  <text x="428" y="563" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="650" fill="#112825">Pulse</text>
  <text x="428" y="584" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" font-weight="450" fill="#526964">Engineer sees the next action</text>
</svg>
