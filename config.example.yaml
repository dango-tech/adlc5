# ADLC5 install locations; model IDs and model settings are chosen with
# `adlc5 setup models` and saved in ~/.adlc5/config.yaml.
skills_install_target: ~/.agents/skills
rules_install_target: ~/.cursor/rules
claude_skills_target: ~/.claude/skills
codex_skills_target: ~/.codex/skills
opencode_skills_target: ~/.config/opencode/skills
gemini_skills_target: ~/.gemini/skills
hermes_skills_target: ~/.hermes/skills/adlc5
antigravity_plugin_target: ~/.gemini/config/plugins/adlc5-plugin
install_backup_root: ~/.adlc5-install-backup
cursor_agents_install_target: ~/.cursor/agents

git_branch_prefix: feat

# Example only. This file is never loaded as a runtime configuration layer.
model_routing:
  strategy: cost_optimized

# `adlc5 setup models` writes structured, host-specific values here.
# platform_profiles:
#   codex:
#     reasoning: { model: "<model-id>", effort: high }
#     balanced: { model: "<model-id>", effort: medium }
#     execution: { model: "<model-id>", effort: low }

defaults:
  interaction_mode: hitl
  execution_mode: parallel
  clarity_threshold: 80
  summary: brief

# Optional scaffold preferences and project wiki settings remain user-owned.
