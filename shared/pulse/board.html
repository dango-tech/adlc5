<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-{{SCRIPT_HASH}}'; connect-src 'none'; img-src data:">
  <title>ADLC5 Pulse · {{TITLE}}</title>
  <style>{{CSS}}</style>
</head>
<body>
  <header><img alt="" src="{{ICON}}"><strong>ADLC5</strong><span>Pulse</span></header>
  <main>
    <h1>Workspace pulse</h1>
    <p id="capture"></p>
    <section aria-labelledby="overview-title"><h2 id="overview-title">Workspace overview</h2><ul id="overview" class="overview"></ul></section>
    <section aria-labelledby="feature-title"><label for="feature">Feature</label><select id="feature" aria-label="Select feature"></select><div id="features" aria-live="polite"></div></section>
    <footer>Local snapshot · regenerate the board to refresh. Evidence describes the repository at capture time.</footer>
  </main>
  <script id="snapshot" type="application/json">{{SNAPSHOT}}</script>
  <script>{{SCRIPT}}</script>
</body>
</html>
